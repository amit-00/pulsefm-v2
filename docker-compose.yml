# Local development stack. `docker compose up` replaces the four-terminal
# bring-up documented in scripts/README.md.
#
# Two things about this file are deliberate and worth reading before changing:
#
# 1. The services build from the PRODUCTION Dockerfiles but override `command`
#    to run the dev ASGI apps from scripts/. The production entrypoint
#    (`pulsefm_radio_service.main:app`) constructs a real CloudTasksClient at
#    import, and there is no Cloud Tasks locally. `build_app(repository,
#    scheduler, clock)` takes the scheduler as a parameter for exactly this
#    reason, so the harness injects a no-op instead of patching main.py.
#    Building the real images is the point: it keeps them exercised.
#
# 2. Some URLs are host-visible, not compose-internal. AUDIO_BASE_URL and
#    VITE_API_BASE_URL are consumed by your BROWSER, so they must be
#    localhost:PORT even though the containers talk to each other by service
#    name. FIRESTORE_EMULATOR_HOST is the opposite — container-to-container,
#    so it is firestore:8080.
#
# The CLIENT is deliberately not in here — run it on the host:
#   cd client && VITE_API_BASE_URL=http://127.0.0.1:8000 npm run dev
# Vite's file watcher needs polling over macOS bind mounts or HMR stops
# working, `npm ci` would re-run on every `up`, and the dev server only
# ever talks to localhost. Containerising it costs speed and buys nothing.
#
# Rotation is still manual. There is no Cloud Tasks, so nothing chains ticks:
#   curl -X POST http://127.0.0.1:8001/tick -H 'Content-Type: application/json' -d '{"version": N}'
# where N is the current version from /v1/state, plus one.

name: pulsefm-dev

services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8080
      --project=pulsefm-local
    ports:
      - "8080:8080"
    healthcheck:
      # The emulator answers any HTTP request once it is listening. Without a
      # gate here the seeder races it and fails on connection refused.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot: generates the WAV fixtures, then writes matching song documents.
  # Runs to completion and exits; the services wait on it.
  seed:
    build:
      context: .
      dockerfile: services/radio-service/Dockerfile
    volumes:
      - ./scripts:/app/scripts:ro
      - ./client/public/tracks:/app/client/public/tracks
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8080
    command: >
      sh -c "python -m scripts.dev_gen_tones && python -m scripts.dev_seed_station"
    depends_on:
      firestore:
        condition: service_healthy

  radio:
    build:
      context: .
      dockerfile: services/radio-service/Dockerfile
    ports:
      - "8001:8080"
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8080
    command: uvicorn scripts.dev_radio_app:app --host 0.0.0.0 --port 8080
    depends_on:
      seed:
        condition: service_completed_successfully

  station:
    build:
      context: .
      dockerfile: services/station-api/Dockerfile
    ports:
      - "8000:8080"
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8080
      # Host-visible: the browser fetches audio from Vite, not from a
      # container. Vite serves client/public/tracks/ at /tracks/.
      AUDIO_BASE_URL: http://localhost:5173
      DEV_CLIENT_ORIGIN: http://localhost:5173
    command: uvicorn scripts.dev_station_app:app --host 0.0.0.0 --port 8080
    depends_on:
      seed:
        condition: service_completed_successfully

  # Bootstraps the station once radio-service is answering, so `up` leaves you
  # with a station already playing rather than a curl to remember.
  bootstrap:
    image: curlimages/curl:latest
    command: >
      sh -c "until curl -sf -o /dev/null http://radio:8080/healthz; do sleep 1; done;
             curl -sS -X POST http://radio:8080/bootstrap"
    depends_on:
      radio:
        condition: service_started
