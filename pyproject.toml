# Rootdir-level pytest config so multi-directory runs (packages + services) share
# settings; per-package configs only apply when pytest's rootdir resolves there.
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Without this, pytest's rootless "prepend" import mode collides on same-named
# test modules across service packages (both have tests/test_main.py) once a
# combined run pulls in more than one service.
addopts = "--import-mode=importlib"
markers = [
    "integration: requires the Firestore emulator (FIRESTORE_EMULATOR_HOST)",
]

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[tool.uv.sources]
pulsefm-models = { workspace = true }
pulsefm-radio-service = { workspace = true }
pulsefm-station-api = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.6.0", "google-cloud-storage>=2.18"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
