name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest packages/ services/ scripts/ -v -m "not integration"

  python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Integration tests against the Firestore emulator
        run: |
          npx -y firebase-tools emulators:exec --only firestore --project pulsefm-test \
            "uv run pytest packages/ services/ scripts/ -v -m integration"
